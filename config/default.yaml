# Competitive three-broker scenario (frame constants per docs/DECISIONS.md).
#
# Calibration policy: every EUR/kWh number below is a representative recent
# anchor from a named public source, not a fitted parameter. Effects of
# broker competition are reported as observed outcomes of the simulation,
# never tuned to produce a desired effect (see docs/PROJECT_CONTEXT.md).

scenario_name: competitive_three_broker

simulation:
  horizon_hours: 8760 # one year, hourly resolution (frame constant)
  seed: 20260704 # fixed for reproducibility; arbitrary, not tuned

population:
  num_agents: 200
  prosumer_fraction: 0.2 # prosumers are a minority of the population (frame constant)
  profile_mix:
    price_sensitive: 0.4
    stability_oriented: 0.3
    green_preferring: 0.3

switching:
  enabled: true # D1: agents may reconsider broker choice under sustained tolerance breach

# D4: per-agent parameters sampled uniformly (integers for hour counts) from these
# bounded ranges using the model's seeded RNG, instead of a few fixed archetypes.
agent_parameters:
  demand_scale:
    min: 0.6
    max: 1.6
  price_tolerance_eur_per_kwh:
    min: 0.18
    max: 0.32
  volatility_tolerance_eur_per_kwh:
    min: 0.01
    max: 0.05
  # F2 fix: widened to straddle the regulated broker's greenness (0.30) so
  # green-preferring agents split into two behavioural groups instead of all
  # landing in {premium_green only} regardless of their sampled threshold
  # (previous [0.35, 0.75] never overlapped any broker's actual greenness value).
  # The volatile broker (0.10) stays rejected by all green-preferring agents
  # since 0.20 (the new minimum) is still above it.
  greenness_threshold:
    min: 0.20
    max: 0.55
  # F3 fix: recalibrated to the order of magnitude of observed inter-broker
  # price gaps (regulated approx 0.17-0.21, volatile baseline 0.12 with realized
  # stdev approx 0.06-0.08, green flat 0.23; gaps of roughly 0.04-0.11), so this
  # status-quo-bias magnitude can actually block a marginal reconsideration
  # instead of being an order of magnitude too small to ever bind (previous
  # [0.003, 0.02] blocked 0 of 78 reconsiderations over a full year).
  switching_penalty_eur_per_kwh:
    min: 0.02
    max: 0.06
  sustained_breach_hours:
    min: 12
    max: 96
  prosumer_pv_capacity_kwp:
    min: 1.5
    max: 4.5
  prosumer_battery_capacity_kwh:
    min: 4.0
    max: 12.0

# D3: fixed (not sampled) reactive-dispatch parameters shared by all prosumers.
prosumer_dispatch:
  reserve_fraction: 0.2
  evening_reserve_hour: 18

# D6 (Phase 3): shared-feeder scarcity charge, additive and OFF by default.
# Master flag: enabled. With it false, the model reproduces the plain
# baseline byte-for-byte (see docs/DECISIONS.md's D6 entry). All coefficients
# below are representative structural values, fixed across the later Phase 5
# sweep (only k, broker_count, and the ablation flags vary there); none is
# tuned to any outcome.
capacity_mechanism:
  enabled: false
  feedback_pnl: false # ledger-debit channel (broker economics only, no price signal)
  feedback_pricing: false # next-step surcharge channel (the physical channel to metric 3)
  window: 168 # trailing hours (one week) for the rolling mean/std threshold
  k: 1.0 # threshold = mean + k * std over the trailing window
  charge_rate_eur_per_kwh: 0.15 # EUR per kWh of excess above threshold (the CHARGE magnitude)
  # Signal-strength coefficient that scales a broker's dimensionless
  # contribution SHARE into a next-step EUR/kWh price adder. This is NOT a
  # EUR/kWh tariff rate; do not read it as one.
  capacity_passthrough: 0.10
  # D7: reference surcharge magnitude (EUR/kWh) against which an agent's own
  # broker surcharge is compared (clipped to [0, 1]) to size how much of its
  # deferrable demand actually gets deferred this hour; a representative
  # structural scale, held fixed across the sweep, not tuned to any outcome.
  response_reference_eur_per_kwh: 0.05
  # D7 (Phase 3b): price-elastic intra-day demand-deferral coefficients --
  # the current physical channel to metric 3 (replaces D6's prosumer storage
  # response, removed; see docs/DECISIONS.md's D7 entry). Both are
  # representative structural coefficients, held FIXED across the Phase 5
  # sweep, never tuned to a metric-3 target.
  deferrable_fraction: 0.2 # fraction of an agent's hourly base demand eligible to be deferred
  payback_cap_fraction: 0.5 # bounds the repayment rate: at most this fraction of an hour's base demand can be repaid in one hour

data:
  solar_profile_path: data/samples/solar_thessaloniki_hourly.csv
  demand_profile_path: data/samples/residential_demand_thessaloniki_hourly.csv
  solar_lat: 40.64 # Thessaloniki
  solar_lon: 22.95
  reference_annual_demand_kwh: 4000 # informational target for the generated fallback demand shape

brokers:
  - id: regulated_utility
    type: regulated_utility
    name: "Regulated Utility"
    greenness: 0.30 # low-medium: standard grid generation mix, not marketed as green
    # Anchor: DEI G1 residential tariff / Eurostat nrg_pc_204 (Greece, household band),
    # order of 0.15-0.25 EUR/kWh in recent years. Representative recent figure, not fitted.
    base_eur_per_kwh: 0.19
    seasonal_amplitude_eur_per_kwh: 0.02 # representative winter-heating seasonal swing, not fitted
    seasonal_peak_day: 15 # mid-January seasonal peak, a representative modelling choice

  - id: volatile_low_cost
    type: volatile_low_cost
    name: "Volatile Low-Cost"
    greenness: 0.10
    # Cheap baseline below the regulated level; loosely anchored to the order of
    # magnitude of HEnEx day-ahead average prices. Representative, not fitted.
    baseline_eur_per_kwh: 0.12
    mean_reversion_phi: 0.85 # AR(1) persistence of the shock (D5); representative choice
    # F4 fix: reduced from 0.03 so the price floor (below) binds as a rare tail
    # guard rather than routinely (measured well under 2% of hours at 0.015,
    # combined with the anti-windup state-reset fix in volatile_low_cost.py;
    # see docs/DECISIONS.md observation note for exact measured hit rates).
    shock_scale_eur_per_kwh: 0.015 # innovation scale; recalibrated for floor rarity (F4)
    shock_degrees_of_freedom: 3 # low df Student-t for heavy tails (D5); representative choice
    price_floor_eur_per_kwh: 0.03 # keeps price physically positive under a large negative shock
    price_cap_multiplier: 4.0 # soft plausibility cap on spike magnitude (x baseline)

  - id: premium_green
    type: premium_green
    name: "Premium Green"
    greenness: 0.95
    # Modest markup over the regulated broker's base level, representative of
    # green-tariff premiums seen in EU retail markets. Representative, not fitted.
    markup_eur_per_kwh: 0.04
